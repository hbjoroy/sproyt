[package]
name = "sproyt-native-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately outside the shipping workspace: this is an interoperability probe.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
fault-injection = []
jni = ["dep:jni"]

[dependencies]
jni = { version = "=0.21.1", optional = true, default-features = false }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sproyt-client-core = { path = "../../../crates/sproyt-client-core" }
