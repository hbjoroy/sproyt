[package]
name = "sproyt-identity-probe"
version = "0.1.0"
edition = "2024"
publish = false

# An isolated laboratory, never linked into the production executable.
[workspace]

[dependencies]
axum = "0.8"
base64 = "0.22"
getrandom = "0.3"
futures-util = "0.3"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sproyt-protocol = { path = "../../../crates/sproyt-protocol" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "sync"] }
