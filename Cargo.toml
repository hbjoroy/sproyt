[package]
name = "sproyt"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
aes-gcm = "0.11"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", features = ["chrono", "migrate", "postgres", "runtime-tokio-rustls", "sqlite", "uuid"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
thiserror = "2"
tower-http = { version = "0.7", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v5", "v7"] }

[dev-dependencies]
futures-util = "0.3"
hmac = "0.13"
rsa = { version = "0.9", features = ["sha2"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
