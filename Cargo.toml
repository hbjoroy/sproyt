[package]
name = "sproyt"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["crates/sproyt-client-core", "crates/sproyt-protocol"]
resolver = "3"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "multipart"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ece = { version = "2.4.2", default-features = false }
futures-util = "0.3"
getrandom = "0.4.3"
hkdf = "0.13"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
kamadak-exif = "0.6.1"
http = "1"
openidconnect = "4.1"
pulldown-cmark = { version = "0.13", default-features = false }
p256 = { version = "0.14", features = ["ecdh"] }
pkcs1 = { version = "0.7", features = ["pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sproyt-protocol = { path = "crates/sproyt-protocol" }
sha2 = "0.11"
sqlx = { version = "0.8", features = ["chrono", "migrate", "postgres", "runtime-tokio-rustls", "sqlite", "uuid"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
thiserror = "2"
tower-http = { version = "0.7.1", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v5", "v7"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
zeroize = "1"

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
