<style>
#fredagsprat .spr{--paper:light-dark(#faf8f2,#202521);--side:light-dark(#efeee4,#293029);--ink:light-dark(#202e29,#eef2e8);--mut:light-dark(#58645a,#bcc7b9);--line:light-dark(#d8dbce,#485148);--leaf:light-dark(#214e44,#b8e6d2);--lime:light-dark(#dfe999,#47592b);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;font:16px/1.42 "Segoe UI",sans-serif;container-type:inline-size}
#fredagsprat .spr *{box-sizing:border-box}#fredagsprat .spr [hidden]{display:none!important}#fredagsprat .spr button{color:inherit;font:inherit;background:transparent;border:0;cursor:pointer;border-radius:9px}#fredagsprat .spr button:hover{background:var(--side)}#fredagsprat .spr button:focus-visible,#fredagsprat .spr input:focus-visible{outline:2px solid var(--leaf);outline-offset:-2px}
#fredagsprat .mast,#fredagsprat header,#fredagsprat .compose,#fredagsprat .meta,#fredagsprat .actions,#fredagsprat .emojirow{display:flex;align-items:center;gap:9px}
#fredagsprat .mast{height:58px;padding:0 19px;border-bottom:1px solid var(--line)}#fredagsprat .brand{display:flex;align-items:center;gap:8px;font:700 27px/1 Georgia,serif;letter-spacing:-1.3px}#fredagsprat .brand img{width:34px;height:34px;object-fit:contain}#fredagsprat .date{margin-left:auto;font-size:13px;color:var(--mut)}#fredagsprat .me{border:1px solid var(--line);border-radius:50%;padding:6px;font-size:11px;font-weight:650}
#fredagsprat .layout{display:grid;grid-template-columns:minmax(180px,24%) minmax(0,1fr)}#fredagsprat nav{background:var(--side);border-right:1px solid var(--line);padding:21px 12px}#fredagsprat nav h3{font:600 18px Georgia,serif;margin:0 8px 16px}#fredagsprat nav button{display:block;width:100%;text-align:left;padding:12px 10px}#fredagsprat nav button[aria-current=true]{background:var(--paper);box-shadow:inset 3px 0 var(--leaf)}#fredagsprat nav strong,#fredagsprat nav small,#fredagsprat nav span{display:block}#fredagsprat small,#fredagsprat time,#fredagsprat .snippet{color:var(--mut);font-size:12px}#fredagsprat .snippet{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#fredagsprat main{position:relative;min-width:0;display:flex;flex-direction:column}#fredagsprat header{justify-content:space-between;padding:13px 22px;border-bottom:1px solid var(--line);color:var(--leaf)}#fredagsprat header small{display:block;font-weight:650}#fredagsprat header h2{margin:0;color:var(--ink);font:600 27px Georgia,serif}#fredagsprat .spr .to-list{display:none;font-size:14px;color:var(--leaf);padding:4px 0}
#fredagsprat .feed{height:355px;overflow:auto;padding:15px 20px;scrollbar-width:thin}#fredagsprat article{display:flex;gap:10px;margin:0 0 var(--gap,12px);align-items:flex-start}#fredagsprat .av{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font:600 16px Georgia,serif;color:var(--ink);background:var(--tone)}#fredagsprat .msg{min-width:0;max-width:100%}#fredagsprat .meta strong{font-size:14px}#fredagsprat .msg p{margin:2px 0;overflow-wrap:anywhere}#fredagsprat .actions{gap:4px;flex-wrap:wrap}#fredagsprat .actions button{font-size:12px;color:var(--mut);min-height:32px;padding:3px 7px}#fredagsprat .actions .count{background:var(--side);border:1px solid var(--line);border-radius:20px}#fredagsprat .actions [aria-pressed=true]{background:var(--lime)}#fredagsprat .rule{display:flex;align-items:center;gap:8px;color:var(--leaf);font-size:12px;margin:8px 0}#fredagsprat .rule:after{content:'';background:var(--line);height:1px;flex:1}
#fredagsprat form{padding:11px 16px 14px;border-top:1px solid var(--line)}#fredagsprat .compose{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:4px 5px 4px 12px}#fredagsprat input{min-width:0;flex:1;background:transparent;color:var(--ink);font:inherit;border:0;height:40px}#fredagsprat .spr .send{background:var(--lime);height:40px;width:42px;display:grid;place-items:center}#fredagsprat .send:disabled{opacity:.58}#fredagsprat .quote{font-size:13px;border-left:3px solid var(--leaf);padding-left:8px;margin-bottom:8px}
#fredagsprat .picker{position:absolute;bottom:72px;left:12px;right:12px;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 28px #14251d24;z-index:2}#fredagsprat .pickhead{display:flex;align-items:center;justify-content:space-between;font-size:14px}#fredagsprat .picker button{min-height:44px;padding:4px 9px}#fredagsprat .emojirow{flex-wrap:wrap;gap:0}#fredagsprat .emojirow button{min-width:44px;font-size:21px}#fredagsprat .picker .pinfo{font-size:13px;color:var(--mut)}#fredagsprat .reader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#fredagsprat .sofa .layout{display:block}#fredagsprat .sofa nav{display:none}#fredagsprat .sofa header{background:var(--side)}#fredagsprat .sofa .to-list{display:inline-block;float:right;margin-left:18px}#fredagsprat .sofa .feed{padding-inline:max(16px,9%)}#fredagsprat .sofa .msg p{background:var(--side);padding:7px 12px;border-radius:0 12px 12px 12px}#fredagsprat .sofa .own{flex-direction:row-reverse}#fredagsprat .sofa .own p{background:var(--lime)}#fredagsprat .spr.list nav{display:block;border:0;min-height:490px}#fredagsprat .spr.list main{display:none}#fredagsprat .spr.list .layout{display:block}
@container(max-width:600px){#fredagsprat .layout{display:block}#fredagsprat nav{display:none}#fredagsprat .spr .to-list{display:block;float:none;margin:0}#fredagsprat .feed{padding-inline:12px}#fredagsprat .actions button{min-height:44px}#fredagsprat header{padding:8px 14px}#fredagsprat .sofa .feed{padding-inline:12px}}

#fredagsprat .tight .mast{height:44px;padding-inline:14px}
#fredagsprat .tight .brand{font-size:23px}
#fredagsprat .tight header{padding:6px 16px;min-height:52px}
#fredagsprat .tight header>div{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#fredagsprat .tight .circle{font:600 24px/1.15 Georgia,serif;color:var(--leaf)}
#fredagsprat .tight .room{font:500 15px/1.3 "Segoe UI",sans-serif;border-left:1px solid var(--line);padding-left:10px}
#fredagsprat .tight nav{padding:13px 8px}
#fredagsprat .tight nav h3{font:500 14px "Segoe UI",sans-serif;color:var(--mut);margin-bottom:12px}
#fredagsprat .tight nav h4{display:flex;align-items:center;gap:8px;margin:12px 4px 4px;font:600 17px Georgia,serif}
#fredagsprat .tight nav h4 i{background:var(--leaf);color:var(--paper);border-radius:7px;display:grid;place-items:center;width:28px;height:28px;font:600 14px Georgia,serif}
#fredagsprat .tight nav button{padding:5px 8px 5px 16px;min-height:44px}
#fredagsprat .tight .feed{padding:10px 14px;height:390px}
#fredagsprat .tight .rule{margin:3px 0 6px}
#fredagsprat .tight form{padding:6px 12px}
@container(max-width:600px){#fredagsprat .tight .to-list{min-height:44px}#fredagsprat .tight header{padding:2px 10px}#fredagsprat .tight header>svg{display:none}#fredagsprat .tight header>div{gap:6px}#fredagsprat .tight .circle{font-size:21px}}
#fredagsprat .tight .circle{font:600 16px/1.3 "Segoe UI",sans-serif}
#fredagsprat .tight nav h4{margin:0}
#fredagsprat .tight nav .group-toggle{display:flex;gap:8px;align-items:center;min-height:44px;font:600 15px "Segoe UI",sans-serif;padding:4px 6px}
#fredagsprat .tight .group-toggle i{width:24px;height:24px;font:500 13px Georgia,serif}
#fredagsprat .tight .group-toggle .chev{margin-left:auto;color:var(--mut)}
#fredagsprat .tight nav section{border-bottom:1px solid var(--line);padding:3px 0}
#fredagsprat .tight .nested{margin:0 0 6px 17px;border-left:1px solid var(--line);padding-left:5px}
#fredagsprat .tight nav .fold{color:var(--mut);font-size:13px}
#fredagsprat .tight .concealed button{font-weight:400;color:var(--mut);padding-left:22px}
#fredagsprat .tight .feed.threedays{height:auto;max-height:660px}
#fredagsprat .dayline{display:flex;align-items:center;gap:9px;margin:8px 0 7px;color:var(--mut);font-size:12px}
#fredagsprat .dayline::after{content:'';flex:1;height:1px;background:var(--line)}
#fredagsprat .dayline strong{font-size:12px;color:var(--leaf);font-weight:600}
#fredagsprat .tight .replay{min-height:44px;font-size:13px;color:var(--leaf)}
#fredagsprat .preview-mobile{padding-block:8px}
#fredagsprat .preview-mobile>section{width:min(100%,360px);margin-inline:auto}
#fredagsprat .tight{height:608px;display:flex;flex-direction:column;box-sizing:border-box}
#fredagsprat .tight .mast{flex:none}
#fredagsprat .tight .mast .replay{margin-left:auto}
#fredagsprat .tight .layout{display:flex;flex:1;min-height:0}
#fredagsprat .tight main{width:100%;min-height:0}
#fredagsprat .tight .feed,#fredagsprat .tight .feed.threedays{min-height:0;flex:1;height:auto;max-height:none;overscroll-behavior:contain}
#fredagsprat .tight header,#fredagsprat .tight form{flex:none}
#fredagsprat .tight.list nav{width:100%;min-height:0;overflow:auto}
#fredagsprat .tight .send{height:44px;width:44px}
#fredagsprat .tight header>div{width:100%}
#fredagsprat .tight header .circle{margin-left:auto}
#fredagsprat .tight .msg{min-width:0}
</style>
<script>
(()=>{
const root=document.getElementById('fredagsprat');
const rooms=['Hyttegutta','Reisegjengen','Hyttegutta','Hyttegutta'];
const channels=['#Prat','#Prat','#Mat og drikke','#Tippekonkurransen'];
const initial=[
 [['Anders','Bryggja på fredag?'],['Mats','Eg er med!'],['Lotte','Skal vi seie klokka sju?'],['Anders','Avtale. Eg tek med kortstokken.'],['Mats','Bordet ved sjøen er ledig. Eg sit her 🍻']],
 [['Ida','Toget går 08.12 på laurdag.'],['Mats','Eg tek vindaugsplassen!']],
 [['Lotte','Skal vi grille makrell på fredag?'],['Anders','Ja! Eg tek med sitron.']],
 [['Mats','Takk for i år! Vi tek ein ny runde til neste meisterskap.']]
];
const colors={Anders:'light-dark(#dfe8ca,#415032)',Lotte:'light-dark(#f0d5bc,#604738)',Mats:'light-dark(#d6e5eb,#354c58)',Du:'var(--lime)'};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons=['🍻','😂','❤️','🏆','✈️','👍','🎣','🥳','⚽','🌊','🙌','⛵'];
for(const el of root.querySelectorAll('.spr')){
 el.append(root.querySelector('template').content.cloneNode(true));
 const q=s=>el.querySelector(s), feed=q('.feed'), picker=q('.picker'), input=q('input');
 const data=initial.map((rows,r)=>rows.map(([name,...lines],i)=>({name,lines,time:['17.42','17.44','17.46'][i],votes:i===0&&r===0?{'🍻':2}:{},mine:{},replies:i===0&&r===0?['Ida: Eg kjem litt over sju.','Anders: Vi held av plass.']:[]})));
 const drafts={},unread=[true,true,false],pins=['🍻'],habits=['😂','❤️','👍'];let recent='🏆',room=0,thread=null,target=null,extra=false,pinning=false;
 const days=['Onsdag 17. juni','I går · torsdag 18. juni','I dag · fredag 19. juni'];
 const times=['19.20','19.24','18.32','18.40','18.55'];
 data[0].forEach((m,i)=>{m.day=i<2?0:i<4?1:2;m.time=times[i];m.replies=[]});
 const arrival=data[0][4];
 const replay=document.createElement('button');replay.type='button';replay.className='replay';replay.dataset.do='replay';replay.textContent='Spel av innkomsten';
 q('.date').replaceWith(replay);
 q('header').lastElementChild.remove();
 const key=()=>room+'/'+thread;
 const btn=(act,val,label,cls='')=>'<button type="button" class="'+cls+'" data-do="'+act+'" data-v="'+esc(val)+'">'+label+'</button>';
 const collapsed=new Set(['Reisegjengen']), shown=new Set(), hiddenChannels=new Set([3]);
 function draw(){
  q('.channels').innerHTML=data.map((rows,i)=>{const last=rows.at(-1);return '<button aria-current="'+(i===room)+'" data-do="open" data-v="'+i+'"><small>'+rooms[i]+'</small><strong>'+channels[i]+'</strong><span class="snippet">'+esc(last.name+' · '+last.lines.at(-1))+'</span></button>'}).join('');
  q('.circle').textContent=rooms[room];q('.room').textContent=thread===null?channels[room]:'Tråd';q('.to-list').textContent=thread===null?'‹ Samtalar':'‹ '+channels[room];q('.to-list').style.display=thread===null?'':'inline-block';
  if(el.classList.contains('tight')){
   q('nav h3').textContent='Vennekretsar';
   q('nav').setAttribute('aria-label','Vennekretsar og kanalar');
   const links=Array.from(q('.channels').children);
   q('.channels').replaceChildren();
   for(const name of new Set(rooms)){
    const section=document.createElement('section');
    const heading=document.createElement('h4');
    const idx=rooms.indexOf(name);
    const foldId='circle-channels-'+idx;
    heading.innerHTML='<button class="group-toggle" data-do="group" data-v="'+idx+'" aria-controls="'+foldId+'" aria-expanded="'+!collapsed.has(name)+'"><i aria-hidden="true">'+esc(name[0])+'</i>'+esc(name)+'<span class="chev" aria-hidden="true">'+(collapsed.has(name)?'▸':'▾')+'</span></button>';
    section.append(heading);
    const body=document.createElement('div');
    body.className='nested';body.id=foldId;body.hidden=collapsed.has(name);
    const concealed=document.createElement('div');concealed.className='concealed';concealed.id='hidden-'+idx;concealed.hidden=!shown.has(name);
    links.forEach((link,i)=>{if(rooms[i]===name){link.querySelector('small').remove();if(hiddenChannels.has(i)){link.querySelector('.snippet').remove();concealed.append(link)}else body.append(link)}});
    if(concealed.childElementCount){
     const fold=document.createElement('button');fold.className='fold';fold.dataset.do='concealed';fold.dataset.v=idx;fold.setAttribute('aria-expanded',String(shown.has(name)));fold.setAttribute('aria-controls',concealed.id);
     fold.textContent=(shown.has(name)?'▾':'▸')+' Skjulte kanalar ('+concealed.childElementCount+')';body.append(fold,concealed);
    }
    section.append(body);
    q('.channels').append(section);
   }
   q('.to-list').textContent=thread===null?'‹ Kretsar':'‹ '+channels[room];
   if(thread!==null)q('.room').textContent=channels[room]+' · Tråd';
  }
  const rows=data[room];
  replay.hidden=room!==0||thread!==null||data[0].some(m=>m.name==='Du');
  feed.classList.toggle('threedays',room===0&&thread===null);
  function divider(m,i){
   if(room!==0)return unread[room]&&i===initial[room].length-1?'<div class="rule">Nytt sidan sist</div>':'';
   const day=m.day??2;
   if(i>0&&(rows[i-1].day??2)===day)return '';
   const fresh=m===arrival&&unread[0];
   return '<div class="dayline"><span>'+days[day]+'</span>'+(fresh?'<strong>Ny melding</strong>':'')+'</div>';
  }
  function article(m,i){
   const reactions=Object.entries(m.votes).filter(([,n])=>n).map(([v,n])=>'<button class="count" data-do="vote" data-i="'+i+'" data-v="'+esc(v)+'" aria-pressed="'+!!m.mine[v]+'">'+esc(v)+' '+n+'</button>').join('');
   return '<article class="'+(m.name==='Du'?'own':'')+'"><span class="av" style="--tone:'+(colors[m.name]||'var(--side)')+'">'+esc(m.name[0])+'</span><div class="msg"><div class="meta"><strong>'+esc(m.name)+'</strong><time>'+esc(m.time)+'</time></div>'+m.lines.map(l=>'<p>'+esc(l)+'</p>').join('')+'<div class="actions">'+reactions+btn('react',i,'☺ Reager')+(thread===null?btn('thread',i,m.replies.length?m.replies.length+' svar':'Svar'):'')+'</div></div></article>';
  }
  feed.innerHTML=thread===null?rows.map((m,i)=>divider(m,i)+article(m,i)).join(''):article(rows[thread],thread)+rows[thread].replies.map(x=>{const n=x.indexOf(': ');return '<article><span class="av" style="--tone:var(--side)">'+esc(x[0])+'</span><div class="msg"><strong>'+esc(x.slice(0,n))+'</strong><p>'+esc(x.slice(n+2))+'</p></div></article>'}).join('');
  q('.quote').hidden=thread===null;if(thread!==null)q('.quote').textContent='Svar til '+rows[thread].name+' · '+rows[thread].lines[0];
  input.placeholder=thread===null?'Skriv i '+channels[room]+' …':'Svar på meldinga …';input.value=drafts[key()]||'';q('.send').disabled=!input.value.trim();
 }
 function showPicker(){
  picker.hidden=target===null;if(picker.hidden)return;
  const visible=[...new Set([...pins,...habits,...[recent]])];
  picker.innerHTML='<div class="pickhead"><strong>'+(pinning?'Fest eller løys reaksjon':'Reager på meldinga')+'</strong>'+btn('close','','Lukk')+'</div><div class="emojirow">'+(extra?[...new Set([...visible,...icons])]:visible).map(v=>btn('emoji',v,esc(v)+(pinning&&pins.includes(v)?' ✓':''))).join('')+'</div>'+btn('more','',extra?'Færre':'Fleire')+(extra?btn('pinmode','',pinning?'Ferdig':'Fest reaksjonar'):'');
 }
 function close(){target=null;extra=false;pinning=false;showPicker()}
 function vote(i,v){const m=data[room][i];m.mine[v]=!m.mine[v];m.votes[v]=(m.votes[v]||0)+(m.mine[v]?1:-1);if(m.mine[v]&&!pins.includes(v)&&!habits.includes(v))recent=v;draw();q('.reader').textContent=m.mine[v]?'Reagerte med '+v:'Fjerna '+v;}
 el.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b)return;const a=b.dataset.do,v=b.dataset.v;
  if(a==='open'){room=Number(v);thread=null;el.classList.remove('list');close();draw();feed.scrollTop=0}
  if(a==='replay'&&data[0].includes(arrival)){
   close();data[0].pop();replay.disabled=true;replay.textContent='Før meldinga';draw();
   setTimeout(()=>{data[0].splice(4,0,arrival);unread[0]=true;replay.disabled=false;replay.textContent='Spel av innkomsten';draw();if(room===0&&thread===null){feed.scrollTop=feed.scrollHeight;q('.reader').textContent='Ny melding frå Mats'}},1300);
  }
  if(a==='group'||a==='concealed'){
   const group=rooms[Number(v)],set=a==='group'?collapsed:shown;
   if(set.has(group))set.delete(group);else set.add(group);
   draw();q('[data-do="'+a+'"][data-v="'+v+'"]').focus();
  }
  if(a==='list'){close();if(thread!==null){thread=null;draw()}else el.classList.add('list')}
  if(a==='thread'){close();thread=Number(v);draw();feed.scrollTop=0}
  if(a==='react'){target=Number(v);extra=false;pinning=false;showPicker();picker.querySelector('button').focus()}
  if(a==='close'){const i=target;close();q('[data-do=react][data-v="'+i+'"]')?.focus()}
  if(a==='more'){extra=!extra;pinning=false;showPicker()}
  if(a==='pinmode'){pinning=!pinning;showPicker()}
  if(a==='emoji'){if(pinning){if(pins.includes(v))pins.splice(pins.indexOf(v),1);else pins.push(v);showPicker()}else{const i=target;close();vote(i,v)}}
  if(a==='vote'){vote(Number(b.dataset.i),v)}
 });
 el.addEventListener('keydown',e=>{if(e.key==='Escape'&&!picker.hidden){picker.querySelector('[data-do=close]').click()}});
 input.addEventListener('input',()=>{drafts[key()]=input.value;q('.send').disabled=!input.value.trim()});
 q('form').addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t)return;drafts[key()]='';if(thread===null){unread[room]=false;data[room].push({name:'Du',lines:[t],time:'No',votes:{},mine:{},replies:[]})}else data[room][thread].replies.push('Du: '+t);close();draw();feed.scrollTop=feed.scrollHeight;input.focus()});
 draw();
 feed.scrollTop=feed.scrollHeight;
 if(globalThis.Tweak){const opts={gap:el.classList.contains('tight')?6:12};const tweak=new Tweak({container:el,onChange:()=>el.style.setProperty('--gap',opts.gap+'px')});tweak.addSlider(opts,'gap',{label:'Luft mellom vener',min:6,max:24,step:2,unit:'px'})}
}
globalThis.lucide?.createIcons();
})();
</script>
</div>
