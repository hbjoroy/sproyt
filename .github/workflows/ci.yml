name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

  postgres-schema:
    name: PostgreSQL repository contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sproyt
          POSTGRES_PASSWORD: sproyt-ci
          POSTGRES_DB: sproyt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sproyt -d sproyt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: sproyt-ci
      SPROYT_POSTGRES_TEST_URL: postgres://sproyt:sproyt-ci@127.0.0.1:5432/sproyt
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-postgres-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-postgres-cargo-

      - name: Run PostgreSQL repository contract
        run: cargo test db::postgres::tests --locked

      - name: Verify expected tables
        run: |
          test "$(psql --host 127.0.0.1 --username sproyt --dbname sproyt --tuples-only --no-align --command "select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('users', 'channels', 'channel_memberships', 'channel_sequences', 'messages');")" = "5"

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache Cargo tools and registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-audit-v1

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: Audit locked dependencies
        run: cargo audit

  delivery:
    name: Container and Kubernetes delivery
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint helm/sproyt --strict

      - name: Render production manifests
        run: >-
          helm template sproyt helm/sproyt
          --namespace sproyt
          --set ingress.enabled=true
          --set config.oidcClientId=ci-client
          --set secret.existingSecret=sproyt-ci
          > rendered-manifests.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: local/sproyt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: local/sproyt:${{ github.sha }}
          format: spdx-json
          output-file: sproyt.spdx.json

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: local/sproyt:${{ github.sha }}
          fail-build: true
          severity-cutoff: high

      - name: Upload delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: delivery-evidence
          path: |
            rendered-manifests.yaml
            sproyt.spdx.json
