name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
    # Pull requests and non-documentation main pushes get the fast
    # quality/PostgreSQL checks. The complete release gate is scheduled,
    # manually dispatched, or selected by a version tag below.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the tested ARM64 image to the production OCI registry
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Validate local Compose profile
        run: docker compose config --quiet

      - name: Validate Authentik discovery contract
        run: bash tools/test-oidc-provider-verifier.sh

      - name: Validate production rollout verifier
        run: bash tools/test-production-rollout-verifier.sh

      - name: Validate MCP load evidence tool
        run: node tools/test-mcp-load.mjs

  postgres-schema:
    name: PostgreSQL repository contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: sproyt
          POSTGRES_PASSWORD: sproyt-ci
          POSTGRES_DB: sproyt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sproyt -d sproyt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: sproyt-ci
      SPROYT_POSTGRES_TEST_URL: postgres://sproyt:sproyt-ci@127.0.0.1:5432/sproyt
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-postgres-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-postgres-cargo-

      - name: Run PostgreSQL repository contract
        run: cargo test db::postgres::tests --locked

      - name: Verify expected tables
        run: |
          test "$(psql --host 127.0.0.1 --username sproyt --dbname sproyt --tuples-only --no-align --command "select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('users', 'channels', 'channel_memberships', 'channel_sequences', 'messages');")" = "5"

  security-audit:
    name: Dependency security audit
    # Ordinary PRs and main pushes stay fast. Run the expensive release gate
    # weekly, explicitly, or for a version tag.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # Remove the pin after RustSec replaces e11d6b3, which accidentally
      # published crates/gettext-rs/RUSTSEC-0000-0000.md on 2026-08-09.
      RUSTSEC_ADVISORY_DB_REVISION: 309ad29d8fe448bf986019e05d47b9e0e29a2218
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache Cargo tools and registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-audit-v1

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: Check out verified RustSec advisory database
        run: |
          git init "$RUNNER_TEMP/rustsec-advisory-db"
          git -C "$RUNNER_TEMP/rustsec-advisory-db" remote add origin https://github.com/RustSec/advisory-db.git
          git -C "$RUNNER_TEMP/rustsec-advisory-db" fetch --depth=1 origin "$RUSTSEC_ADVISORY_DB_REVISION"
          git -C "$RUNNER_TEMP/rustsec-advisory-db" checkout --detach FETCH_HEAD

      - name: Audit locked dependencies
        # No fixed release exists. Sproyt performs public-key verification only;
        # see docs/security-exceptions.md for the bounded acceptance.
        run: cargo audit --db "$RUNNER_TEMP/rustsec-advisory-db" --no-fetch --ignore RUSTSEC-2023-0071

  recovery-drill:
    name: PostgreSQL backup and restore drill
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: sproyt
          POSTGRES_PASSWORD: sproyt-recovery
          POSTGRES_DB: sproyt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sproyt -d sproyt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: sproyt-recovery
      DATABASE_URL: postgres://sproyt:sproyt-recovery@127.0.0.1:5432/sproyt
      SPROYT_ENV: test
      SPROYT_AUTH_MODE: development
    steps:
      - uses: actions/checkout@v6
      - name: Migrate source database
        run: cargo run --locked -- migrate
      - name: Seed durable chat evidence
        run: |
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          insert into users(id,kind,display_name,created_at) values('01900000-0000-7000-8000-000000000001','human','Recovery user',now());
          insert into channels(id,slug,name,kind,created_by) values('01900000-0000-7000-8000-000000000002','recovery','Recovery','private','01900000-0000-7000-8000-000000000001');
          insert into channel_memberships(channel_id,user_id,role) values('01900000-0000-7000-8000-000000000002','01900000-0000-7000-8000-000000000001','owner');
          insert into channel_sequences(channel_id,next_sequence) values('01900000-0000-7000-8000-000000000002',2);
          insert into messages(id,channel_id,sender_id,sender_display_name,sequence,body) values('01900000-0000-7000-8000-000000000003','01900000-0000-7000-8000-000000000002','01900000-0000-7000-8000-000000000001','Recovery user',1,'restore-evidence');
          SQL
      - name: Backup and restore into isolated database
        run: |
          client_image='postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193'
          docker run --rm --network host -e PGPASSWORD -v "$PWD:/backup" "$client_image" \
            pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" --file /backup/sproyt.dump
          docker run --rm --network host -e PGPASSWORD "$client_image" \
            createdb --host 127.0.0.1 --username sproyt sproyt_restore
          docker run --rm --network host -e PGPASSWORD -v "$PWD:/backup" "$client_image" \
            pg_restore --exit-on-error --no-owner --no-acl --host 127.0.0.1 \
              --username sproyt --dbname sproyt_restore /backup/sproyt.dump
      - name: Apply forward migrations and verify integrity
        env:
          DATABASE_URL: postgres://sproyt:sproyt-recovery@127.0.0.1:5432/sproyt_restore
        run: |
          cargo run --locked -- migrate
          test "$(psql "$DATABASE_URL" --tuples-only --no-align --command "select count(*) from messages where body='restore-evidence'")" = "1"
          test "$(psql "$DATABASE_URL" --tuples-only --no-align --command "select max(sequence) from messages where channel_id='01900000-0000-7000-8000-000000000002'")" = "1"
          test "$(psql "$DATABASE_URL" --tuples-only --no-align --command "select sender_display_name from messages where id='01900000-0000-7000-8000-000000000003'")" = "Recovery user"
      - uses: actions/upload-artifact@v6
        with:
          name: recovery-drill-backup
          path: sproyt.dump
          retention-days: 7

  delivery-arm64:
    name: ARM64 release image and delivery evidence
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: >-
          helm lint helm/sproyt --strict
          --set config.oidcIssuer=https://sproyt-security.bjoroy.me/application/o/sproyt/
          --set config.oidcClientId=ci-client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cross-build ARM64 release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          load: true
          push: false
          tags: local/sproyt-arm64:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Record image-to-commit evidence
        id: image-evidence
        env:
          SPROYT_IMAGE: local/sproyt-arm64:${{ github.sha }}
        run: |
          image_id=$(docker image inspect "$SPROYT_IMAGE" --format '{{.Id}}')
          revision=$(docker image inspect "$SPROYT_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          architecture=$(docker image inspect "$SPROYT_IMAGE" --format '{{.Architecture}}')
          operating_system=$(docker image inspect "$SPROYT_IMAGE" --format '{{.Os}}')
          test "$revision" = "$GITHUB_SHA"
          test "$architecture" = arm64
          test "$operating_system" = linux
          test "${image_id#sha256:}" != "$image_id"
          echo "digest=$image_id" >> "$GITHUB_OUTPUT"
          jq --null-input \
            --arg image "$SPROYT_IMAGE" \
            --arg image_id "$image_id" \
            --arg revision "$revision" \
            --arg architecture "$architecture" \
            --arg operating_system "$operating_system" \
            '{image: $image, image_id: $image_id, revision: $revision, architecture: $architecture, operating_system: $operating_system}' \
            > image-evidence.json

      - name: Render digest-pinned production manifests
        run: >-
          helm template sproyt helm/sproyt
          --namespace sproyt
          --set ingress.enabled=true
          --set config.oidcIssuer=https://sproyt-security.bjoroy.me/application/o/sproyt/
          --set config.oidcClientId=ci-client
          --set secret.existingSecret=sproyt-ci
          --set image.digest=${{ steps.image-evidence.outputs.digest }}
          --set monitoring.serviceMonitor.enabled=true
          --set monitoring.prometheusRule.enabled=true
          --set monitoring.grafanaDashboard.enabled=true
          > rendered-manifests.yaml

      - name: Verify Helm production delivery contract
        run: bash tools/verify-helm-delivery.sh helm/sproyt ${{ steps.image-evidence.outputs.digest }}

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: local/sproyt-arm64:${{ github.sha }}
          format: spdx-json
          output-file: sproyt.spdx.json

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: local/sproyt-arm64:${{ github.sha }}
          fail-build: true
          severity-cutoff: high

      - name: Upload delivery evidence
        uses: actions/upload-artifact@v6
        with:
          name: delivery-evidence
          path: |
            rendered-manifests.yaml
            sproyt.spdx.json
            image-evidence.json

      - name: Export tested ARM64 release image
        run: docker save --output sproyt-arm64.tar local/sproyt-arm64:${{ github.sha }}

      - name: Upload tested ARM64 release image
        uses: actions/upload-artifact@v6
        with:
          name: release-image-${{ github.sha }}
          path: sproyt-arm64.tar
          retention-days: 1
          compression-level: 0

  # TODO: Restore the native AMD64 Kind smoke when its dependency cache has a
  # bounded, independently verified backend. Evidence from the split builds
  # suggests the large arm64 and amd64 GHA cache scopes may evict each other
  # under the repository cache quota; verify isolated backends or retention.
  # Production currently publishes only the tested ARM64 Raspberry Pi image.

  publish-image:
    name: Publish immutable OCI image
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_image &&
      github.ref == 'refs/heads/main')
    needs:
      - quality
      - postgres-schema
      - security-audit
      - recovery-drill
      - delivery-arm64
    runs-on: ubuntu-latest
    environment:
      name: production-registry
      deployment: false
    env:
      REGCTL_IMAGE: regclient/regctl:v0.11.5@sha256:dbe356c6cf9f8f85e302b9e47fed481ef3f1b04807350e99b02ab2cadee0a993
    steps:
      - name: Download tested ARM64 release image
        uses: actions/download-artifact@v7
        with:
          name: release-image-${{ github.sha }}

      - name: Load and verify tested image
        env:
          LOCAL_IMAGE: local/sproyt-arm64:${{ github.sha }}
        run: |
          docker load --input sproyt-arm64.tar
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Os}}')" = linux
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"

      - name: Log in to production OCI registry
        env:
          SPROYT_OCI_USERNAME: ${{ secrets.SPROYT_OCI_USERNAME }}
          SPROYT_OCI_PASSWORD: ${{ secrets.SPROYT_OCI_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regctl-config"
          printf '%s' "$SPROYT_OCI_PASSWORD" | docker run --rm -i --user 0:0 \
            -e HOME=/config \
            -v "$RUNNER_TEMP/regctl-config:/config" \
            "$REGCTL_IMAGE" \
            registry login oci.bjoroy.me --user "$SPROYT_OCI_USERNAME" --pass-stdin

      - name: Publish immutable commit tag
        id: publish
        env:
          REGISTRY_IMAGE: oci.bjoroy.me/sproyt/sproyt:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --user 0:0 \
            -e HOME=/config \
            -v "$RUNNER_TEMP/regctl-config:/config" \
            -v "$PWD:/work:ro" \
            "$REGCTL_IMAGE" \
            image import "$REGISTRY_IMAGE" /work/sproyt-arm64.tar
          registry_digest=$(docker run --rm --user 0:0 \
            -e HOME=/config \
            -v "$RUNNER_TEMP/regctl-config:/config" \
            "$REGCTL_IMAGE" \
            image digest "$REGISTRY_IMAGE")
          [[ "$registry_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$registry_digest" >> "$GITHUB_OUTPUT"
          jq --null-input \
            --arg image "$REGISTRY_IMAGE" \
            --arg digest "$registry_digest" \
            --arg revision "$GITHUB_SHA" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{image: $image, digest: $digest, revision: $revision, workflow_run: $workflow_run}' \
            > registry-evidence.json

      - name: Upload registry evidence
        uses: actions/upload-artifact@v6
        with:
          name: registry-evidence-${{ github.sha }}
          path: registry-evidence.json
          retention-days: 30
