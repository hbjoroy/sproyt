name: Native interoperability probe

on:
  pull_request:
    paths:
      - 'native/probes/**'
      - 'crates/sproyt-client-core/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-probe.yml'
  push:
    branches: [main]
    paths:
      - 'native/probes/**'
      - 'crates/sproyt-client-core/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interoperability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.301'
      - name: Install pinned Rust
        shell: pwsh
        run: rustup show active-toolchain
      - name: Run the isolated Rust and managed probe
        shell: pwsh
        run: ./native/probes/run-probe.ps1 -ArtifactsDirectory '${{ runner.temp }}/sproyt-native-probe'
      - name: Preserve non-secret fixture receipts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: native-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/sproyt-native-probe/fixtures/**/receipt.json
