name: Native interoperability probe

on:
  pull_request:
    paths:
      - 'native/probes/**'
      - 'native/session-client/**'
      - 'crates/sproyt-client-core/**'
      - 'crates/sproyt-protocol/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-probe.yml'
  push:
    branches: [main]
    paths:
      - 'native/probes/**'
      - 'native/session-client/**'
      - 'crates/sproyt-client-core/**'
      - 'crates/sproyt-protocol/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentik-passkey-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Start separate localhost recovery and passkey laboratory
        shell: pwsh
        run: ./native/probes/authentik/start-lab.ps1 -ArtifactsDirectory '${{ runner.temp }}/sproyt-passkey' -Recovery
      - name: Verify WebAuthn policy and negative flow contract
        shell: pwsh
        run: |
          $labs = @(Get-ChildItem '${{ runner.temp }}/sproyt-passkey/runs' -Directory)
          if ($labs.Count -ne 1) { throw 'Expected one separate passkey lab.' }
          ./native/probes/authentik/run-passkey.ps1 -RunDirectory $labs[0].FullName -Phase Contract
      - name: Measure recovery links and blocking policy failure boundaries
        shell: pwsh
        run: |
          $labs = @(Get-ChildItem '${{ runner.temp }}/sproyt-passkey/runs' -Directory)
          if ($labs.Count -ne 1) { throw 'Expected one separate recovery lab.' }
          ./native/probes/authentik/run-recovery.ps1 -RunDirectory $labs[0].FullName
      - name: Measure scoped public recovery API and concurrent link consumption
        shell: pwsh
        run: |
          $labs = @(Get-ChildItem '${{ runner.temp }}/sproyt-passkey/runs' -Directory)
          if ($labs.Count -ne 1) { throw 'Expected one separate recovery lab.' }
          ./native/probes/authentik/run-recovery-api.ps1 -RunDirectory $labs[0].FullName
      - name: Preserve only non-secret passkey configuration receipts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: native-passkey-configuration
          retention-days: 7
          path: ${{ runner.temp }}/sproyt-passkey/runs/**/passkey-checks/**/evidence/receipt.json
      - name: Preserve only non-secret recovery receipts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: native-recovery-link-contract
          retention-days: 7
          path: ${{ runner.temp }}/sproyt-passkey/runs/**/recovery-checks/**/evidence/receipt.json
      - name: Preserve only non-secret public recovery API receipts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: native-recovery-api-contract
          retention-days: 7
          path: ${{ runner.temp }}/sproyt-passkey/runs/**/recovery-api-checks/**/evidence/receipt.json
      - name: Stop only owned passkey laboratory containers
        if: always()
        shell: pwsh
        run: |
          if (Test-Path '${{ runner.temp }}/sproyt-passkey/runs') {
            Get-ChildItem '${{ runner.temp }}/sproyt-passkey/runs' -Directory | ForEach-Object {
              ./native/probes/authentik/stop-lab.ps1 -RunDirectory $_.FullName
            }
          }

  authentik-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.301'
      - name: Install pinned Rust
        shell: pwsh
        run: rustup show active-toolchain
      - name: Start isolated pinned Authentik and PostgreSQL
        shell: pwsh
        run: ./native/probes/authentik/start-lab.ps1 -ArtifactsDirectory '${{ runner.temp }}/sproyt-authentik'
      - name: Verify OIDC identity and provider refresh behavior
        shell: pwsh
        run: |
          $labs = @(Get-ChildItem '${{ runner.temp }}/sproyt-authentik/runs' -Directory)
          if ($labs.Count -ne 1) { throw 'Expected one isolated Authentik run.' }
          ./native/probes/authentik/run-lab.ps1 -RunDirectory $labs[0].FullName -HttpOnly
      - name: Verify isolated provider revocation scope
        shell: pwsh
        run: |
          $labs = @(Get-ChildItem '${{ runner.temp }}/sproyt-authentik/runs' -Directory)
          if ($labs.Count -ne 1) { throw 'Expected one isolated Authentik run.' }
          ./native/probes/authentik/run-lab.ps1 -RunDirectory $labs[0].FullName -HttpOnly -Revocation
      - name: Preserve only non-secret Authentik receipts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: native-authentik-contract
          retention-days: 7
          path: ${{ runner.temp }}/sproyt-authentik/runs/**/evidence/receipt.json
      - name: Stop only owned local lab containers
        if: always()
        shell: pwsh
        run: |
          if (Test-Path '${{ runner.temp }}/sproyt-authentik/runs') {
            Get-ChildItem '${{ runner.temp }}/sproyt-authentik/runs' -Directory | ForEach-Object {
              ./native/probes/authentik/stop-lab.ps1 -RunDirectory $_.FullName
            }
          }

  native-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.301'
      - name: Install pinned Rust
        shell: pwsh
        run: rustup show active-toolchain
      - name: Verify the isolated OIDC and native handoff laboratory
        shell: pwsh
        run: ./native/probes/run-identity-probe.ps1 -ArtifactsDirectory '${{ runner.temp }}/sproyt-native-identity'
      - name: Preserve non-secret identity receipts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: native-identity-${{ matrix.os }}
          retention-days: 7
          path: ${{ runner.temp }}/sproyt-native-identity/runs/**/receipt.json

  windows-reactor:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.301'
      - name: Install pinned Rust
        shell: pwsh
        run: rustup show active-toolchain
      - name: Build and test the isolated native Windows UI
        shell: pwsh
        run: ./native/probes/run-windows-reactor.ps1 -Architecture x64 -ArtifactsDirectory '${{ runner.temp }}/sproyt-reactor' -UiSmoke
      - name: Preserve Windows evidence and bounded failure diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-probe-windows-reactor
          retention-days: 7
          path: |
            ${{ runner.temp }}/sproyt-reactor/runs/**/receipt.json
            ${{ runner.temp }}/sproyt-reactor/runs/**/core-result.txt
            ${{ runner.temp }}/sproyt-reactor/runs/**/ui-result.json
            ${{ runner.temp }}/sproyt-reactor/runs/**/ui-resume-result.json
            ${{ runner.temp }}/sproyt-reactor/runs/**/ui-closed.txt
            ${{ runner.temp }}/sproyt-reactor/runs/**/ui-resume-closed.txt
            ${{ runner.temp }}/sproyt-reactor/runs/**/ui-failure.txt
            ${{ runner.temp }}/sproyt-reactor/runs/**/ui-resume-failure.txt
            ${{ runner.temp }}/sproyt-reactor/runs/**/startup.log
            ${{ runner.temp }}/sproyt-reactor/runs/**/session-ui/*-result.json
            ${{ runner.temp }}/sproyt-reactor/runs/**/session-ui/*-closed.txt
            ${{ runner.temp }}/sproyt-reactor/runs/**/session-ui/*-failure.txt

  interoperability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.301'
      - name: Install pinned Rust
        shell: pwsh
        run: rustup show active-toolchain
      - name: Run the isolated Rust and managed probe
        shell: pwsh
        run: ./native/probes/run-probe.ps1 -ArtifactsDirectory '${{ runner.temp }}/sproyt-native-probe'
      - name: Preserve non-secret fixture receipts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: native-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/sproyt-native-probe/fixtures/**/receipt.json

  kotlin-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: native/probes/kotlin/pom.xml
      - name: Install pinned Rust
        shell: pwsh
        run: rustup show active-toolchain
      - name: Run the Kotlin JVM and JNI binding probe
        shell: pwsh
        run: ./native/probes/run-language-probe.ps1 -Language kotlin -ArtifactsDirectory '${{ runner.temp }}/sproyt-native-language-probe'
      - name: Preserve Kotlin fixture receipts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: native-probe-kotlin
          path: ${{ runner.temp }}/sproyt-native-language-probe/kotlin/fixtures/**/receipt.json

  swift-binding:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Record Apple toolchain
        run: swift --version
      - name: Install pinned Rust
        shell: pwsh
        run: rustup show active-toolchain
      - name: Run the Swift and C header binding probe
        shell: pwsh
        run: ./native/probes/run-language-probe.ps1 -Language swift -ArtifactsDirectory '${{ runner.temp }}/sproyt-native-language-probe'
      - name: Preserve Swift fixture receipts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: native-probe-swift
          path: ${{ runner.temp }}/sproyt-native-language-probe/swift/fixtures/**/receipt.json
