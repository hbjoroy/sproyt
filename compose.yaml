services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sproyt
      POSTGRES_USER: sproyt
      POSTGRES_PASSWORD: sproyt-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sproyt -d sproyt"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sproyt-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["migrate"]
    environment: &sproyt-environment
      DATABASE_URL: postgres://sproyt:sproyt-dev@postgres:5432/sproyt
      SPROYT_ENV: development
      SPROYT_AUTH_MODE: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  sproyt:
    build: .
    environment: *sproyt-environment
    ports:
      - "9010:9010"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sproyt-postgres:
