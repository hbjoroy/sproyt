      order: 201
  - identifiers: {name: sproyt-canary-v2-password}
    id: canary-v2-password
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password
      label: Passord
      type: password
      required: true
      initial_value: ""
      order: 300
  - identifiers: {name: sproyt-canary-v2-password-repeat}
    id: canary-v2-password-repeat
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password_repeat
      label: Gjenta passordet
      type: password
      required: true
      initial_value: ""
      order: 301
  - identifiers: {name: sproyt-canary-v2-profile-prompt}
    id: canary-v2-profile-prompt
    model: authentik_stages_prompt.promptstage
    attrs:
      fields: [!KeyOf canary-v2-username, !KeyOf canary-v2-name]
  - identifiers: {name: sproyt-canary-v2-password-prompt}
    id: canary-v2-password-prompt
    model: authentik_stages_prompt.promptstage
    attrs:
      fields: [!KeyOf canary-v2-password, !KeyOf canary-v2-password-repeat]
      validation_policies:
        - !Find [authentik_policies.policy, [name, default-password-change-password-policy]]

  - identifiers: {name: sproyt-canary-v2-before-create}
    id: canary-v2-before-create
    model: authentik_policies_expression.expressionpolicy
    attrs:
      failure_result: true
      expression: |
        from authentik.core.models import User

        plan = request.context.get("flow_plan")
        if plan is None or "sproyt_canary_v2_create_user" not in plan.context:
            return True
        if plan.context["sproyt_canary_v2_create_user"] is False:
            return False
        email = plan.context.get("sproyt_canary_v2_email")
        prompt = request.context.get("prompt_data")
        if not email or not isinstance(prompt, dict):
            return True
        if str(prompt.get("email", "")).strip().casefold() != email.casefold():
            return True
        # An account appearing during registration must never be overwritten.
        if User.objects.filter(email__iexact=email).exists():
            return True
        # Only the fields from this enrollment are allowed to reach User Write.
        clean = {key: prompt[key] for key in ("username", "name") if key in prompt}
        # UserWrite calls set_password(None), producing Django's unusable hash.
        clean["password"] = None
        clean["email"] = email
        clean["attributes"] = {"email_verified": False}
        request.context["prompt_data"] = clean
        plan.context["prompt_data"] = clean
        return False

  - identifiers: {name: sproyt-canary-v2-user-create}
    id: canary-v2-user-create
    model: authentik_stages_user_write.userwritestage
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: true
      create_users_group: !Find [authentik_core.group, [name, sproyt-users]]
      user_type: external
      user_path_template: users/sproyt
  - identifiers: {name: sproyt-canary-v2-stamp-placeholder}
    id: canary-v2-stamp-placeholder
    model: authentik_policies_expression.expressionpolicy
    attrs:
      failure_result: true
      expression: |
        from authentik.core.models import User, Group
        from django.db import transaction
        from django.core import signing
        from hashlib import sha256

        plan = request.context.get("flow_plan")
        if plan is None or "sproyt_canary_v2_create_user" not in plan.context:
            return True
        if plan.context["sproyt_canary_v2_create_user"] is False:
            return False
        snapshot = plan.context.get("pending_user")
        email = str(plan.context.get("sproyt_canary_v2_email", "")).strip().casefold()
        if snapshot is None or snapshot.pk is None or not email:
            return True
        with transaction.atomic():
            user = User.objects.select_for_update().get(pk=snapshot.pk)
            group = Group.objects.get(name="sproyt-users")
            if (user.uuid != snapshot.uuid or user.last_updated != snapshot.last_updated
                or user.password != snapshot.password or user.email.strip().casefold() != email
                or user.is_active or user.has_usable_password() or user.last_login is not None
                or user.type != "external" or user.path != "users/sproyt"
                or list(user.groups.values_list("pk", flat=True)) != [group.pk]
                or user.roles.exists() or user.sources.exists() or user.is_superuser
                or "sproyt_canary_v2_pending" in (user.attributes or {})):
                return True
            marker = signing.dumps({"v": 2, "flow": "a1b4b2b7-80e3-591d-b52f-bed0ae3e5a35", "pk": user.pk,
                                    "uuid": str(user.uuid), "email": email,
                                    "updated": user.last_updated.isoformat(),
                                    "password": sha256(user.password.encode()).hexdigest(),
                                    "group": str(group.pk)}, salt="sproyt.canary.invitation-placeholder.v2")
            user.attributes = dict(user.attributes or {}, sproyt_canary_v2_pending=marker)
            # update_fields deliberately preserves the creation timestamp. Normal admin
            # saves advance last_updated and thereby revoke recovery, even while inactive.
            user.save(update_fields=["attributes"])
            plan.context["pending_user"] = user
            request.context["pending_user"] = user
            plan.context["sproyt_canary_v2_marker"] = marker
        return False

  - identifiers: {name: sproyt-canary-v2-password-write-guard}
    id: canary-v2-password-write-guard
    model: authentik_policies_expression.expressionpolicy
    attrs:
      failure_result: true
      expression: |
        from django.core import signing
        from hashlib import sha256

        def eligible(user, marker):
            if not isinstance(marker, str):
                return False
            try:
                origin = signing.loads(marker, salt="sproyt.canary.invitation-placeholder.v2", max_age=86400)
            except signing.BadSignature:
                return False
            return (
                origin == {"v": 2, "flow": "a1b4b2b7-80e3-591d-b52f-bed0ae3e5a35", "pk": user.pk,
                           "uuid": str(user.uuid), "email": str(user.email).strip().casefold(),
                           "updated": user.last_updated.isoformat(),
                           "password": sha256(user.password.encode()).hexdigest(),
                           "group": origin.get("group")}
                and origin.get("group") is not None
                and list(map(str, user.groups.values_list("pk", flat=True))) == [origin["group"]]
                and not user.roles.exists() and not user.sources.exists() and not user.is_superuser
                and not user.is_active and not user.has_usable_password() and user.last_login is None
                and user.type == "external" and user.path == "users/sproyt"
                and (user.attributes or {}).get("sproyt_canary_v2_pending") == marker
            )

        from authentik.core.models import User
        from django.db import transaction
        from django.utils.timezone import now

        plan = request.context.get("flow_plan")
        if plan is None or "sproyt_canary_v2_new_user" not in plan.context:
            return True
        if plan.context["sproyt_canary_v2_new_user"] is False:
            return False
        pending = plan.context.get("pending_user")
        proof = request.context.get("is_restored")
        prompt = request.context.get("prompt_data", {})
        email = str(plan.context.get("sproyt_canary_v2_email", "")).strip().casefold()
        if (proof is None or proof.expires <= now() or str(proof.flow_id) != "a1b4b2b7-80e3-591d-b52f-bed0ae3e5a35"
            or plan.context.get("sproyt_canary_v2_mailbox_verified") is not True
            or pending is None or pending.pk != plan.context.get("sproyt_canary_v2_verified_user_id")
            or pending.pk != getattr(proof.user, "pk", None)
            or not prompt.get("password") or prompt.get("password") != prompt.get("password_repeat")):
            return True
        original = proof.plan
        if (len(original.bindings) < 2 or original.bindings[1].stage.name != "sproyt-canary-v2-existing-email"
            or original.context.get("sproyt_canary_v2_new_user") is not True
            or original.context.get("sproyt_canary_v2_verify_email") is not True
            or getattr(original.context.get("pending_user"), "pk", None) != pending.pk
            or str(original.context.get("email", "")).strip().casefold() != email
            or original.context.get("redirect") != plan.context.get("redirect")
            or original.context.get("sproyt_canary_v2_marker") != plan.context.get("sproyt_canary_v2_marker")):
            return True
        with transaction.atomic():
            user = User.objects.select_for_update().get(pk=pending.pk)
            if (proof.expires <= now() or not eligible(user, plan.context.get("sproyt_canary_v2_marker"))
                or user.email.strip().casefold() != email
                or (user.attributes or {}).get("email_verified") is not True
                or str(user.attributes.get("email_verified_address", "")).strip().casefold() != email):
                return True
            # A second flow cannot change credentials after this first commit. All
            # eligibility checks, hashing, activation and marker removal share this lock.
            user.set_password(prompt["password"], request=request.http_request)
            user.is_active = True
            attributes = dict(user.attributes)
            attributes.pop("sproyt_canary_v2_pending")
            user.attributes = attributes
            user.save(update_fields=["password", "password_change_date", "is_active", "attributes", "last_updated"])
            plan.context["pending_user"] = user
            request.context["pending_user"] = user
            plan.context["prompt_data"] = {}
            request.context["prompt_data"] = {}
        return False

