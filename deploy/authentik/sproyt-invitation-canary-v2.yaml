  - identifiers: {target: !KeyOf canary-v2-flow, stage: !KeyOf canary-v2-deny, order: 48}
    id: canary-v2-proof-binding
    model: authentik_flows.flowstagebinding
    attrs: {evaluate_on_plan: false, re_evaluate_policies: true, policy_engine_mode: all}
  - identifiers: {policy: !KeyOf canary-v2-email-proof, target: !KeyOf canary-v2-proof-binding, order: 0}
