      placeholder: Brukarnamn
      initial_value: ""
      initial_value_expression: false
      order: 200
  - identifiers: {name: sproyt-canary-v2-name}
    id: canary-v2-name
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: name
