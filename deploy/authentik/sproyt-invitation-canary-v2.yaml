version: 1
metadata:
  name: Sprøyt Canary V2 invitation enrollment
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - identifiers:
      pk: a1b4b2b7-80e3-591d-b52f-bed0ae3e5a35
    id: canary-v2-flow
    model: authentik_flows.flow
    attrs:
      slug: sproyt-invitation-canary-v2
      name: Sprøyt Canary V2 invitation
      title: Bli med i Sprøyt
      designation: enrollment
      authentication: none
      denied_action: message

  - identifiers: {name: sproyt-canary-v2-invitation}
    id: canary-v2-invitation
    model: authentik_stages_invitation.invitationstage
    attrs: {continue_flow_without_invitation: false}

  - identifiers: {name: sproyt-canary-v2-invitation-deny}
    id: canary-v2-deny
    model: authentik_stages_deny.denystage
    attrs:
      deny_message: Invitasjonen er ugyldig eller registreringa kan ikkje fullførast. Be om ei ny invitasjon.

  - identifiers: {name: sproyt-canary-v2-invitation-context}
    id: canary-v2-context
    model: authentik_policies_expression.expressionpolicy
    attrs:
      failure_result: true
      expression: |
        from django.core import signing
        from hashlib import sha256

        def eligible(user, marker):
            if not isinstance(marker, str):
                return False
            try:
                origin = signing.loads(marker, salt="sproyt.canary.invitation-placeholder.v2", max_age=86400)
            except signing.BadSignature:
                return False
            return (
                origin == {"v": 2, "flow": "a1b4b2b7-80e3-591d-b52f-bed0ae3e5a35", "pk": user.pk,
                           "uuid": str(user.uuid), "email": str(user.email).strip().casefold(),
                           "updated": user.last_updated.isoformat(),
                           "password": sha256(user.password.encode()).hexdigest(),
                           "group": origin.get("group")}
                and origin.get("group") is not None
                and list(map(str, user.groups.values_list("pk", flat=True))) == [origin["group"]]
                and not user.roles.exists() and not user.sources.exists() and not user.is_superuser
                and not user.is_active and not user.has_usable_password() and user.last_login is None
                and user.type == "external" and user.path == "users/sproyt"
                and (user.attributes or {}).get("sproyt_canary_v2_pending") == marker
            )

        from authentik.core.models import User

        invitation = request.context.get("invitation")
        plan = request.context.get("flow_plan")
        if invitation is None or plan is None or not request.context.get("invitation_in_effect"):
            return True
        if str(getattr(invitation, "flow_id", "")) != "a1b4b2b7-80e3-591d-b52f-bed0ae3e5a35":
            return True
        fixed = invitation.fixed_data or {}
        token = fixed.get("sproyt_enrollment_token")
        email = str(fixed.get("email", "")).strip()
        if not email or not isinstance(token, str) or len(token) != 43 or not all(
            c in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_" for c in token
        ):
            return True
        # The Invitation stage has already consumed its single-use object.
        # Retain its trusted context, never a prompt field or a caller's next.
        matches = list(User.objects.filter(email__iexact=email)[:2])
        if len(matches) > 1:
            return True
        existing = bool(matches)
        plan.context["sproyt_canary_v2_create_user"] = not existing
        plan.context["sproyt_canary_v2_new_user"] = not existing
        plan.context["sproyt_canary_v2_email"] = email
        plan.context["email"] = email
        plan.context["redirect"] = "https://sproyt-canary.bjoroy.me/auth/login?enrollment=" + token
        plan.context["sproyt_canary_v2_verify_email"] = not existing
        if existing:
            user = matches[0]
            attributes = user.attributes or {}
            marker = attributes.get("sproyt_canary_v2_pending")
            recovery = eligible(user, marker)
            plan.context["sproyt_canary_v2_new_user"] = recovery
            if recovery:
                plan.context["sproyt_canary_v2_marker"] = marker
            verified = attributes.get("email_verified") is True and str(
                attributes.get("email_verified_address", "")
            ).strip().casefold() == email.casefold()
            if recovery or not verified:
                # Resuming a pending registration always requires a NEW mailbox proof.
                plan.context["pending_user"] = user
                request.context["pending_user"] = user
                plan.context["sproyt_canary_v2_verify_email"] = True
        prompt = request.context.get("prompt_data", {})
        prompt.pop("sproyt_enrollment_token", None)
        plan.context.get("prompt_data", {}).pop("sproyt_enrollment_token", None)
        # Existing non-placeholder identities never reach password write or login.
        # The subsequent Sprøyt OIDC login must authenticate the actual recipient.
        return False

  - identifiers: {name: sproyt-canary-v2-new-user-only}
    id: canary-v2-new-only
    model: authentik_policies_expression.expressionpolicy
    attrs:
      failure_result: false
      expression: |
        plan = request.context.get("flow_plan")
        return plan is not None and plan.context.get("sproyt_canary_v2_new_user") is True

  - identifiers: {name: sproyt-canary-v2-create-only}
    id: canary-v2-create-only
    model: authentik_policies_expression.expressionpolicy
    attrs:
      failure_result: false
      expression: |
        plan = request.context.get("flow_plan")
        return plan is not None and plan.context.get("sproyt_canary_v2_create_user") is True

  - identifiers: {name: sproyt-canary-v2-email-rate-limit}
    id: canary-v2-email-rate-limit
    model: authentik_policies_expression.expressionpolicy
    attrs:
      failure_result: true
      expression: |
        from django.core.cache import cache
        from hashlib import sha256

        plan = request.context.get("flow_plan")
        if plan is None or "sproyt_canary_v2_verify_email" not in plan.context:
            return True
        if plan.context["sproyt_canary_v2_verify_email"] is False:
            return False
        if request.context.get("is_restored") or plan.context.get("sproyt_canary_v2_send_counted"):
            return False
        email = str(plan.context.get("sproyt_canary_v2_email", "")).strip().casefold()
        if not email:
            return True
        key = "sproyt:canary:v2:verify:first-send:" + sha256(email.encode("utf-8")).hexdigest()
        try:
            attempts = 1 if cache.add(key, 1, timeout=300) else cache.incr(key)
        except Exception:
            return True
        plan.context["sproyt_canary_v2_send_counted"] = True
        return attempts > 5

  - identifiers: {name: sproyt-canary-v2-email-required}
    id: canary-v2-email-required
    model: authentik_policies_expression.expressionpolicy
    attrs:
      failure_result: false
      expression: |
        plan = request.context.get("flow_plan")
        return plan is not None and plan.context.get("sproyt_canary_v2_verify_email") is True

  - identifiers: {name: sproyt-canary-v2-existing-email}
    id: canary-v2-existing-email
    model: authentik_stages_email.emailstage
    attrs:
      use_global_settings: true
      token_expiry: minutes=30
      subject: Stadfest e-postadressa di for Sprøyt
      template: email/account_confirmation.html
      activate_user_on_success: false
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=5

  - identifiers: {name: sproyt-canary-v2-email-proof}
    id: canary-v2-email-proof
    model: authentik_policies_expression.expressionpolicy
    attrs:
      failure_result: true
      expression: |
        from django.core import signing
        from hashlib import sha256

        def eligible(user, marker):
            if not isinstance(marker, str):
                return False
            try:
                origin = signing.loads(marker, salt="sproyt.canary.invitation-placeholder.v2", max_age=86400)
            except signing.BadSignature:
                return False
            return (
                origin == {"v": 2, "flow": "a1b4b2b7-80e3-591d-b52f-bed0ae3e5a35", "pk": user.pk,
                           "uuid": str(user.uuid), "email": str(user.email).strip().casefold(),
                           "updated": user.last_updated.isoformat(),
                           "password": sha256(user.password.encode()).hexdigest(),
                           "group": origin.get("group")}
                and origin.get("group") is not None
                and list(map(str, user.groups.values_list("pk", flat=True))) == [origin["group"]]
                and not user.roles.exists() and not user.sources.exists() and not user.is_superuser
                and not user.is_active and not user.has_usable_password() and user.last_login is None
                and user.type == "external" and user.path == "users/sproyt"
                and (user.attributes or {}).get("sproyt_canary_v2_pending") == marker
            )

        from authentik.core.models import User
        from django.db import transaction
        from django.utils.timezone import now

        plan = request.context.get("flow_plan")
        if plan is None or "sproyt_canary_v2_verify_email" not in plan.context:
            return True
        if plan.context["sproyt_canary_v2_verify_email"] is False:
            return False
        token = request.context.get("is_restored")
        if token is None or token.expires <= now() or str(token.flow_id) != "a1b4b2b7-80e3-591d-b52f-bed0ae3e5a35":
            return True
        original = token.plan
        original_user = original.context.get("pending_user")
        current_user = plan.context.get("pending_user")
        email = str(original.context.get("email", "")).strip()
        # Authentik 2026.8.2 prepends its email-token consent stage at index 0.
        if len(original.bindings) < 2 or original.bindings[1].stage.name != "sproyt-canary-v2-existing-email":
            return True
        if (not email or original.context.get("sproyt_canary_v2_verify_email") is not True
            or getattr(original_user, "pk", None) is None
            or original_user.pk != getattr(current_user, "pk", None)
            or original_user.pk != getattr(token.user, "pk", None)
            or original.context.get("sproyt_canary_v2_new_user") is not plan.context.get("sproyt_canary_v2_new_user")
            or email.casefold() != str(plan.context.get("sproyt_canary_v2_email", "")).strip().casefold()
            or original.context.get("redirect") != plan.context.get("redirect")
            or original.context.get("sproyt_canary_v2_marker") != plan.context.get("sproyt_canary_v2_marker")):
            return True
        # EmailStage's fresh mailbox token is unavailable to the inviter. Bind
        # its original snapshot before touching only verification attributes.
        with transaction.atomic():
            user = User.objects.select_for_update().get(pk=original_user.pk)
            if token.expires <= now() or str(user.email).strip().casefold() != email.casefold():
                return True
            if plan.context.get("sproyt_canary_v2_new_user") is True and not eligible(
                user, plan.context.get("sproyt_canary_v2_marker")
            ):
                return True
            attributes = dict(user.attributes or {})
            attributes["email_verified"] = True
            attributes["email_verified_address"] = user.email.strip()
            user.attributes = attributes
            user.save(update_fields=["attributes"])
            plan.context["pending_user"] = user
            request.context["pending_user"] = user
            plan.context["sproyt_canary_v2_mailbox_verified"] = True
            plan.context["sproyt_canary_v2_verified_user_id"] = user.pk
        return False

  - identifiers: {name: sproyt-canary-v2-username}
