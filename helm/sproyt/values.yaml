replicaCount: 2
terminationGracePeriodSeconds: 30

image:
  repository: oci.bjoroy.me/sproyt/sproyt
  tag: "0.1.0"
  # Production releases should set the registry digest, for example sha256:...
  digest: ""
  pullPolicy: IfNotPresent

# Secrets must exist in the release namespace. Leave empty for public/local images.
imagePullSecrets: []
# - name: oci-pull-secret

service:
  port: 80
  targetPort: 9010

ingress:
  enabled: false
  className: ""
  host: sproyt.bjoroy.me
  tlsSecretName: ""

config:
  environment: production
  logFormat: json
  authMode: oidc
  # Pinned production issuer exposed through Cloudflare.
  oidcIssuer: https://sproyt-security.bjoroy.me/application/o/sproyt/
  oidcClientId: ""
  oidcRedirectUrl: https://sproyt.bjoroy.me/auth/callback
  oidcPostLogoutRedirectUrl: https://sproyt.bjoroy.me/
  heartUrl: ""
  mcpAllowedOrigins: https://sproyt.bjoroy.me
  websocketIdleTimeoutSeconds: 60
  # Keep Heart/process diagnostics out of the ordinary private-beta journey.
  uiAdvancedEnabled: false

secret:
  existingSecret: sproyt
  databaseUrlKey: DATABASE_URL
  oidcClientSecretKey: SPROYT_OIDC_CLIENT_SECRET
  sessionKeyKey: SPROYT_SESSION_KEY
  sessionPreviousKeysKey: SPROYT_SESSION_PREVIOUS_KEYS
  # Change this opaque value when externally managed secret contents change.
  rolloutChecksum: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  minAvailable: 1

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}
  prometheusRule:
    enabled: false
    additionalLabels: {}
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

networkPolicy:
  enabled: true
  # Empty means ingress is limited to pods in the release namespace.
  ingressNamespaceSelector: {}
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  databaseSameNamespace: true
  databaseNamespaceSelector: {}
  databasePodSelector: {}
  databaseCidrs: []
  # Required for an in-cluster Heart endpoint on a non-HTTPS port. HTTPS
  # endpoints are already covered by the general OIDC/HTTPS egress rule.
  heartSameNamespace: false
  heartNamespaceSelector: {}
  heartPodSelector: {}
  heartCidrs: []
  heartPort: 3000
