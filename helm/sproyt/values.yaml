replicaCount: 2

image:
  repository: oci.bjoroy.me/sproyt/sproyt
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 9010

ingress:
  enabled: false
  className: ""
  host: sproyt.example.com
  tlsSecretName: ""

config:
  environment: production
  logFormat: json
  authMode: oidc
  oidcIssuer: https://identity.limani-parou.com/application/o/sproyt/
  oidcClientId: ""
  oidcRedirectUrl: https://sproyt.example.com/auth/callback
  oidcPostLogoutRedirectUrl: https://sproyt.example.com/
  heartUrl: ""

secret:
  existingSecret: sproyt
  databaseUrlKey: DATABASE_URL
  oidcClientSecretKey: SPROYT_OIDC_CLIENT_SECRET
  sessionKeyKey: SPROYT_SESSION_KEY

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  databaseCidrs: []
