{{- if and .Values.heart.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sproyt.heart.fullname" . }}
  labels:
    {{- include "sproyt.heart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: heart
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "sproyt.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if .Values.heart.databaseSameNamespace }}
    - to:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 5432}
    {{- end }}
    {{- with .Values.heart.databaseNamespaceSelector }}
    - to:
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- with $.Values.heart.databasePodSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - {protocol: TCP, port: 5432}
    {{- end }}
{{- end }}
