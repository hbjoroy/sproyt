{{- if .Values.heart.enabled }}
{{- $jobs := .Values.heart.runtimeV2.externalJobs | default dict }}
{{- $tls := $jobs.tls | default dict }}
{{- if and $tls.existingSecret (not $jobs.credentialsSecret) }}
{{- fail "Heart worker TLS requires a worker credentials Secret" }}
{{- end }}
{{- if and $jobs.newWorkEnabled (not (and .Values.heart.runtimeV2.enabled $jobs.credentialsSecret)) }}
{{- fail "Heart external job admission requires runtime v2 and a worker credentials Secret" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sproyt.heart.fullname" . }}
  labels:
    {{- include "sproyt.heart.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: heart
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: runtime
  ports:
    - name: http
      port: {{ .Values.heart.service.port }}
      targetPort: http
    {{- if $jobs.credentialsSecret }}
    - name: external-jobs
      port: 3001
      targetPort: external-jobs
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sproyt.heart.fullname" . }}
  labels:
    {{- include "sproyt.heart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.heart.replicaCount }}
  strategy:
    # Wait for every old runtime pod to terminate before starting replacements.
    # Runtime pools (6) + one maintenance process per release (2) fit role cap 8.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: heart
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "sproyt.heart.labels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: heart
          image: {{ include "sproyt.heart.image" . | quote }}
          imagePullPolicy: {{ .Values.heart.image.pullPolicy }}
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:3000
            - name: HEART_DB_MAX_CONNECTIONS
              value: {{ .Values.heart.dbMaxConnections | quote }}
            - name: HEART_RUNTIME_V2_ENABLED
              value: {{ .Values.heart.runtimeV2.enabled | quote }}
            {{- if $jobs.credentialsSecret }}
            - name: HEART_RUNTIME_V2_EXTERNAL_JOBS_ADMISSION_ENABLED
              value: {{ default false $jobs.newWorkEnabled | quote }}
            - name: HEART_RUNTIME_V2_EXTERNAL_JOBS_CREDENTIALS_FILE
              value: /etc/heart/external-workers/credentials.json
            - name: HEART_RUNTIME_V2_EXTERNAL_JOBS_BIND_ADDR
              value: 0.0.0.0:3001
            {{- if $tls.existingSecret }}
            - name: HEART_RUNTIME_V2_EXTERNAL_JOBS_TLS_CERT_FILE
              value: /etc/heart/external-worker-tls/tls.crt
            - name: HEART_RUNTIME_V2_EXTERNAL_JOBS_TLS_KEY_FILE
              value: /etc/heart/external-worker-tls/tls.key
            {{- end }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.heart.secret.existingSecret }}
                  key: {{ .Values.heart.secret.databaseUrlKey }}
          ports:
            - name: http
              containerPort: 3000
            {{- if $jobs.credentialsSecret }}
            - name: external-jobs
              containerPort: 3001
            {{- end }}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.heart.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if $jobs.credentialsSecret }}
          volumeMounts:
            - name: external-worker-credentials
              mountPath: /etc/heart/external-workers
              readOnly: true
            {{- if $tls.existingSecret }}
            - name: external-worker-tls
              mountPath: /etc/heart/external-worker-tls
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if $jobs.credentialsSecret }}
      volumes:
        - name: external-worker-credentials
          secret:
            secretName: {{ $jobs.credentialsSecret | quote }}
            items:
              - key: {{ default "credentials.json" $jobs.credentialsSecretKey | quote }}
                path: credentials.json
        {{- if $tls.existingSecret }}
        - name: external-worker-tls
          secret:
            secretName: {{ $tls.existingSecret | quote }}
        {{- end }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: heart
              app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sproyt.heart.fullname" . }}
  labels:
    {{- include "sproyt.heart.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.heart.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: heart
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runtime
{{- end }}
