{{- if .Values.heart.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sproyt.heart.fullname" . }}-definitions
  labels:
    {{- include "sproyt.heart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  event-planning.yaml: |
{{ .Files.Get "definitions/event-planning.yaml" | indent 4 }}
{{- end }}
