{{- if .Values.heart.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sproyt.heart.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "sproyt.heart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  parallelism: 1
  completions: 1
  # Do not overlap a retry with a still-terminating maintenance pod.
  podReplacementPolicy: Failed
  activeDeadlineSeconds: 180
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "sproyt.heart.labels" . | nindent 8 }}
        app.kubernetes.io/component: maintenance
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "sproyt.heart.image" . | quote }}
          imagePullPolicy: {{ .Values.heart.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: HEART_DB_MAX_CONNECTIONS
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.heart.secret.existingSecret }}
                  key: {{ .Values.heart.secret.databaseUrlKey }}
          resources:
            {{- toYaml .Values.heart.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
