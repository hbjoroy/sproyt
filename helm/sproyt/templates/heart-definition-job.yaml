{{- if .Values.heart.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sproyt.heart.fullname" . }}-definitions-{{ .Release.Revision }}
  labels:
    {{- include "sproyt.heart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "sproyt.heart.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap-definition
          image: {{ include "sproyt.heart.image" . | quote }}
          imagePullPolicy: {{ .Values.heart.image.pullPolicy }}
          args: ["bootstrap-definition", "/definitions/event-planning.yaml"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.heart.secret.existingSecret }}
                  key: {{ .Values.heart.secret.databaseUrlKey }}
          volumeMounts:
            - name: definitions
              mountPath: /definitions
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: definitions
          configMap:
            name: {{ include "sproyt.heart.fullname" . }}-definitions
{{- end }}
