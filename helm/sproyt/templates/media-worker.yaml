{{- if .Values.mediaWorker.enabled }}
{{- if and (eq .Values.config.environment "production") (not .Values.mediaWorker.image.digest) }}
{{- fail "mediaWorker.image.digest is required in production" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sproyt.fullname" . }}-media-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sproyt-media-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sproyt-media-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: media-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-worker
          {{- if .Values.mediaWorker.image.digest }}
          image: {{ printf "%s@%s" .Values.mediaWorker.image.repository .Values.mediaWorker.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.mediaWorker.image.repository .Values.mediaWorker.image.tag | quote }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret }}
                  key: {{ .Values.secret.databaseUrlKey }}
            - name: SPROYT_LOG_FORMAT
              value: json
            - name: SPROYT_MEDIA_SCRATCH_DIR
              value: /tmp/media-worker
          resources:
            {{- toYaml .Values.mediaWorker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.mediaWorker.scratchSize | quote }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sproyt.fullname" . }}-media-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sproyt-media-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.databaseSameNamespace }}
    - to:
        - podSelector:
            {{- toYaml .Values.networkPolicy.databasePodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- with .Values.networkPolicy.databaseNamespaceSelector }}
    - to:
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- with $.Values.networkPolicy.databasePodSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- range .Values.networkPolicy.databaseCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
{{- end }}
{{- end }}
